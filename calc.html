<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="calc.css">
  <title>Document</title>
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" readonly>
    <div class="btn-container">
      <button class="btn" data-action="clear" style="background-color: orange;">c</button>
      <button class="btn" data-val="1">1</button>
      <button class="btn" data-val="2">2</button>
      <button class="btn" data-val="3">3</button>
      <button class="btn" data-val="+" style="background-color: aqua;">+</button>
      <button class="btn" data-val="4">4</button>
      <button class="btn" data-val="5">5</button>
      <button class="btn" data-val="6">6</button>
      <button class="btn" data-val="-" style="background-color: aqua;">-</button>
      <button class="btn" data-val="7">7</button>
      <button class="btn" data-val="8">8</button>
      <button class="btn" data-val="9">9</button>
      <button class="btn" data-val="*" style="background-color: aqua;">*</button>
      <button class="btn" data-val="/" style="background-color: aqua;">/</button>
      <button class="btn" data-val="0">0</button>
      <button class="btn" data-val=".">.</button>
      <button class="btn" data-action="calculate" style="background-color: aqua;width: 220px;">=</button>
    </div><br><br>

  </div>
  <script>
    // Cache DOM element reference to avoid repeated document.querySelector lookups on every click
    const displayElement = document.querySelector('#display');
    const btnContainer = document.querySelector('.btn-container');
    let currentValue = '';

    displayElement.value = currentValue;

    // Use event delegation on container to handle all button clicks with a single listener
    btnContainer.addEventListener('click', (event) => {
      const button = event.target.closest('.btn');
      if (!button) return;

      const action = button.dataset.action;
      const val = button.dataset.val;

      if (action === 'clear') {
        currentValue = '';
      } else if (action === 'calculate') {
        try {
          currentValue = String(eval(currentValue));
        } catch (e) {
          currentValue = 'Error';
        }
      } else if (val !== undefined) {
        currentValue += val;
      }

      displayElement.value = currentValue;
    });
  </script>
</body>
</html>
