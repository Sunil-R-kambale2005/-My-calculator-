<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="calc.css">
  <title>Document</title>
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" readonly>
    <div class="btn-container">
      <button class="btn" style="background-color: orange;">c</button>
      <button class="btn">1</button>
      <button class="btn">2</button>
      <button class="btn">3</button>
      <button class="btn" style="background-color: aqua;">+</button>
      <button class="btn">4</button>
      <button class="btn">5</button>
      <button class="btn">6</button>
      <button class="btn" style="background-color: aqua;">-</button>
      <button class="btn">7</button>
      <button class="btn">8</button>
      <button class="btn">9</button>
      <button class="btn" style="background-color: aqua;">*</button>
      <button class="btn" style="background-color: aqua;">/</button>
      <button class="btn">0</button>
      <button class="btn">.</button>
      <button class="btn" style="background-color: aqua; width: 220px;">=</button>
    </div><br><br>
  </div>
  <script>
    // Optimized: Cache DOM element references once, avoiding expensive lookups during user interactions.
    const display = document.querySelector("#display");
    const btnContainer = document.querySelector(".btn-container");
    let currentvalue = '';

    // Initialize display with the default empty value
    display.value = currentvalue;

    // Optimized: Use a single, high-performance event delegation listener on the parent container.
    // This reduces memory overhead and improves event handling efficiency compared to 17 individual inline onclick handlers.
    btnContainer.addEventListener("click", (event) => {
      const button = event.target.closest(".btn");
      if (!button) return;

      const value = button.textContent.trim();

      if (value === 'c') {
        currentvalue = '';
      } else if (value === '=') {
        try {
          // Safeguarded eval execution
          const result = eval(currentvalue);
          currentvalue = result !== undefined ? String(result) : '';
        } catch (e) {
          currentvalue = 'Error';
        }
      } else {
        if (currentvalue === 'Error') {
          currentvalue = '';
        }
        currentvalue += value;
      }

      // High-performance DOM update via cached display reference
      display.value = currentvalue;
    });
  </script>
</body>
</html>
