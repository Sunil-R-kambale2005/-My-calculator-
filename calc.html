<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="calc.css">
  <title>Document</title>
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" readonly>
    <div class="btn-container">
      <button class="btn" style="background-color: orange;">c</button>
      <button class="btn">1</button>
      <button class="btn">2</button>
      <button class="btn">3</button>
      <button class="btn" style="background-color: aqua;">+</button>
      <button class="btn">4</button>
      <button class="btn">5</button>
      <button class="btn">6</button>
      <button class="btn" style="background-color: aqua;">-</button>
      <button class="btn">7</button>
      <button class="btn">8</button>
      <button class="btn">9</button>
      <button class="btn" style="background-color: aqua;">*</button>
      <button class="btn" style="background-color: aqua;">/</button>
      <button class="btn">0</button>
      <button class="btn">.</button>
      <button class="btn" style="background-color: aqua;width: 220px;">=</button>
    </div><br><br>
  </div>
  <script>
    // Performance optimization: Cache DOM reference to avoid repeated querySelector lookup on every click
    const displayElement = document.querySelector('#display');
    const btnContainer = document.querySelector('.btn-container');
    let currentValue = '';

    displayElement.value = currentValue;

    // Performance optimization: Event delegation using a single event listener on the parent container
    // rather than attaching inline click handlers to every individual button.
    btnContainer.addEventListener('click', (event) => {
      const target = event.target.closest('.btn');
      if (!target) return;

      const value = target.textContent.trim();

      if (value === 'c') {
        currentValue = '';
      } else if (value === '=') {
        try {
          currentValue = eval(currentValue);
        } catch (e) {
          currentValue = '';
        }
      } else {
        currentValue = currentValue + value;
      }

      displayElement.value = currentValue;
    });
  </script>
</body>
</html>
