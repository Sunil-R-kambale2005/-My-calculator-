<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="calc.css">
  <title>Document</title>
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" readonly>
    <div class="btn-container">
      <button class="btn" style="background-color: orange;">c</button>
      <button class="btn">1</button>
      <button class="btn">2</button>
      <button class="btn">3</button>
      <button class="btn" style="background-color: aqua;">+</button>
      <button class="btn">4</button>
      <button class="btn">5</button>
      <button class="btn">6</button>
      <button class="btn" style="background-color: aqua;">-</button>
      <button class="btn">7</button>
      <button class="btn">8</button>
      <button class="btn">9</button>
      <button class="btn" style="background-color: aqua;">*</button>
      <button class="btn" style="background-color: aqua;">/</button>
      <button class="btn">0</button>
      <button class="btn">.</button>
      <button class="btn" style="background-color: aqua;width: 220px;">=</button>
    </div><br><br>

  </div>
  <script>
    // Bolt Performance Optimization:
    // 1. Cache the '#display' DOM element reference once during initialization, avoiding repeated document.querySelector lookups on every click.
    // 2. Event Delegation: Use a single click event listener on '.btn-container' instead of inline handlers on each button, reducing memory allocation.
    const displayElement = document.querySelector('#display');
    const container = document.querySelector('.btn-container');
    let currentValue = '';
    displayElement.value = currentValue;

    container.addEventListener('click', (event) => {
      const button = event.target.closest('button.btn');
      if (!button) return;

      const val = button.innerText.trim();
      if (val === 'c') {
        currentValue = '';
      } else if (val === '=') {
        try {
          currentValue = String(eval(currentValue));
        } catch (e) {
          currentValue = 'Error';
        }
      } else {
        currentValue += val;
      }
      displayElement.value = currentValue;
    });
  </script>
</body>
</html>
