<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="calc.css">
  <title>Document</title>
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" readonly>
    <div class="btn-container">
      <!-- Removed all repetitive inline onclick handlers to optimize HTML payload size -->
      <button class="btn" style="background-color: orange;">c</button>
      <button class="btn">1</button>
      <button class="btn">2</button>
      <button class="btn">3</button>
      <button class="btn" style="background-color: aqua;">+</button>
      <button class="btn">4</button>
      <button class="btn">5</button>
      <button class="btn">6</button>
      <button class="btn" style="background-color: aqua;">-</button>
      <button class="btn">7</button>
      <button class="btn">8</button>
      <button class="btn">9</button>
      <button class="btn" style="background-color: aqua;">*</button>
      <button class="btn" style="background-color: aqua;">/</button>
      <button class="btn">0</button>
      <button class="btn">.</button>
      <button class="btn" style="background-color: aqua; width: 220px;">=</button>
    </div><br><br>
  </div>
  <script>
    // Performance optimization: Cache DOM reference to avoid repetitive DOM queries on every click
    const displayElement = document.querySelector("#display");
    const btnContainer = document.querySelector(".btn-container");

    let currentvalue = '';
    displayElement.value = currentvalue;

    // Performance optimization: Implement Event Delegation.
    // Instead of attaching 17 click handlers, we use a single handler on the parent container.
    btnContainer.addEventListener("click", function(event) {
      const button = event.target.closest(".btn");
      if (!button) return;

      const action = button.textContent.trim();

      if (action === 'c') {
        currentvalue = '';
      } else if (action === '=') {
        try {
          // Evaluate the expression, keeping the same core behavior as original
          const result = eval(currentvalue);
          currentvalue = result === undefined ? '' : String(result);
        } catch (error) {
          currentvalue = 'Error';
        }
      } else {
        currentvalue = currentvalue + action;
      }

      displayElement.value = currentvalue;
    });
  </script>
</body>
</html>
