<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="calc.css">
  <title>Document</title>
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" readonly>
    <div class="btn-container">
      <button class="btn" data-action="clear" style="background-color: orange;">c</button>
      <button class="btn" data-val="1">1</button>
      <button class="btn" data-val="2">2</button>
      <button class="btn" data-val="3">3</button>
      <button class="btn" data-val="+" style="background-color: aqua;">+</button>
      <button class="btn" data-val="4">4</button>
      <button class="btn" data-val="5">5</button>
      <button class="btn" data-val="6">6</button>
      <button class="btn" data-val="-" style="background-color: aqua;">-</button>
      <button class="btn" data-val="7">7</button>
      <button class="btn" data-val="8">8</button>
      <button class="btn" data-val="9">9</button>
      <button class="btn" data-val="*" style="background-color: aqua;">*</button>
      <button class="btn" data-val="/" style="background-color: aqua;">/</button>
      <button class="btn" data-val="0">0</button>
      <button class="btn" data-val=".">.</button>
      <button class="btn" data-action="calculate" style="background-color: aqua; width: 220px;">=</button>
    </div><br><br>
  </div>
  <script>
    // Bolt Optimization:
    // 1. Cache the #display element query to prevent repeated DOM scans on every click.
    // 2. Implement event delegation with a single event listener on the container instead of 17 individual inline handlers.
    let currentvalue = '';
    const displayElement = document.querySelector("#display");
    const container = document.querySelector(".btn-container");

    displayElement.value = currentvalue;

    container.addEventListener("click", function(event) {
      const target = event.target;
      if (!target.classList.contains("btn")) return;

      const action = target.getAttribute("data-action");
      const value = target.getAttribute("data-val");

      if (action === "clear") {
        currentvalue = '';
      } else if (action === "calculate") {
        try {
          // Check if currentvalue exists and has non-empty text before eval
          if (currentvalue.trim() !== '') {
            currentvalue = String(eval(currentvalue));
          }
        } catch (e) {
          currentvalue = 'Error';
        }
      } else if (value !== null) {
        currentvalue = currentvalue + value;
      }

      displayElement.value = currentvalue;
    });
  </script>
</body>
</html>
