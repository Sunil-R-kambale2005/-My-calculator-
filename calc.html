<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="calc.css">
  <title>Document</title>
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" readonly>
    <div class="btn-container">
      <!--
        Performance Optimization:
        1. Centralized event handling functions (clearDisplay, appendVal, calculate).
        2. Caching the '#display' element reference to prevent expensive DOM queries on every click.
        3. Drastically reduced inline HTML payload size from repetitive DOM query strings.
      -->
      <button class="btn" onclick="clearDisplay()" style="background-color: orange;">c</button>
      <button class="btn" onclick="appendVal('1')">1</button>
      <button class="btn" onclick="appendVal('2')">2</button>
      <button class="btn" onclick="appendVal('3')">3</button>
      <button class="btn" onclick="appendVal('+')" style="background-color: aqua;">+</button>
      <button class="btn" onclick="appendVal('4')">4</button>
      <button class="btn" onclick="appendVal('5')">5</button>
      <button class="btn" onclick="appendVal('6')">6</button>
      <button class="btn" onclick="appendVal('-')" style="background-color: aqua;">-</button>
      <button class="btn" onclick="appendVal('7')">7</button>
      <button class="btn" onclick="appendVal('8')">8</button>
      <button class="btn" onclick="appendVal('9')">9</button>
      <button class="btn" onclick="appendVal('*')" style="background-color:aqua">*</button>
      <button class="btn" onclick="appendVal('/')" style="background-color: aqua;">/</button>
      <button class="btn" onclick="appendVal('0')">0</button>
      <button class="btn" onclick="appendVal('.')">.</button>
      <button class="btn" onclick="calculate()" style="background-color: aqua;width: 220px;">=</button>
    </div><br><br>

  </div>
  <script>
    let currentvalue = '';
    // Cache display element to avoid repeated querySelector lookup overhead
    const displayElement = document.querySelector("#display");
    displayElement.value = currentvalue;

    function clearDisplay() {
      currentvalue = '';
      displayElement.value = currentvalue;
    }

    function appendVal(val) {
      currentvalue = currentvalue + val;
      displayElement.value = currentvalue;
    }

    function calculate() {
      currentvalue = eval(currentvalue);
      displayElement.value = currentvalue;
    }
  </script>
</body>
</html>
