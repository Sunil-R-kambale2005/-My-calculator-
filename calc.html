<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="calc.css">
  <title>Document</title>
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" readonly>
    <div class="btn-container">
      <button class="btn" style="background-color: orange;">c</button>
      <button class="btn">1</button>
      <button class="btn">2</button>
      <button class="btn">3</button>
      <button class="btn" style="background-color: aqua;">+</button>
      <button class="btn">4</button>
      <button class="btn">5</button>
      <button class="btn">6</button>
      <button class="btn" style="background-color: aqua;">-</button>
      <button class="btn">7</button>
      <button class="btn">8</button>
      <button class="btn">9</button>
      <button class="btn" style="background-color: aqua;">*</button>
      <button class="btn" style="background-color: aqua;">/</button>
      <button class="btn">0</button>
      <button class="btn">.</button>
      <button class="btn" style="background-color: aqua;width: 220px;">=</button>
    </div><br><br>

  </div>
  <script>
    // Bolt Performance Optimization:
    // 1. Cache the #display element reference once in script scope to avoid executing document.querySelector on every button click.
    // 2. Use event delegation on .btn-container instead of attaching 17 inline onclick event listeners, reducing DOM attributes and memory footprint.
    const display = document.querySelector("#display");
    let currentvalue = '';
    display.value = currentvalue;

    document.querySelector('.btn-container').addEventListener('click', (e) => {
      const target = e.target;
      if (!target.classList.contains('btn')) return;

      const val = target.innerText.trim();
      if (val === 'c') {
        currentvalue = '';
      } else if (val === '=') {
        currentvalue = eval(currentvalue);
      } else {
        currentvalue += val;
      }
      display.value = currentvalue;
    });
  </script>
</body>
</html>
