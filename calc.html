<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="calc.css">
  <title>Document</title>
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" readonly>
    <div class="btn-container">
      <button class="btn" data-value="c" style="background-color: orange;">c</button>
      <button class="btn" data-value="1">1</button>
      <button class="btn" data-value="2">2</button>
      <button class="btn" data-value="3">3</button>
      <button class="btn" data-value="+" style="background-color: aqua;">+</button>
      <button class="btn" data-value="4">4</button>
      <button class="btn" data-value="5">5</button>
      <button class="btn" data-value="6">6</button>
      <button class="btn" data-value="-" style="background-color: aqua;">-</button>
      <button class="btn" data-value="7">7</button>
      <button class="btn" data-value="8">8</button>
      <button class="btn" data-value="9">9</button>
      <button class="btn" data-value="*" style="background-color: aqua;">*</button>
      <button class="btn" data-value="/" style="background-color: aqua;">/</button>
      <button class="btn" data-value="0">0</button>
      <button class="btn" data-value=".">.</button>
      <button class="btn" data-value="=" style="background-color: aqua; width: 220px;">=</button>
    </div><br><br>

  </div>
  <script>
    let currentvalue = '';

    // Performance optimization: Cache DOM lookup instead of querying #display on every button click
    const displayElement = document.querySelector("#display");
    displayElement.value = currentvalue;

    // Performance optimization: Event delegation on .btn-container instead of multiple inline onclick attributes
    const btnContainer = document.querySelector(".btn-container");
    btnContainer.addEventListener("click", (e) => {
      const button = e.target.closest("button.btn");
      if (!button) return;

      const action = button.getAttribute("data-value");
      if (action === "c") {
        currentvalue = '';
      } else if (action === "=") {
        try {
          currentvalue = eval(currentvalue);
        } catch (err) {
          currentvalue = '';
        }
      } else if (action) {
        currentvalue += action;
      }

      displayElement.value = currentvalue;
    });
  </script>
</body>
</html>
