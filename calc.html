<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="calc.css">
  <title>Document</title>
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" readonly>
    <div class="btn-container">
      <button class="btn" data-action="clear" style="background-color: orange;">c</button>
      <button class="btn" data-value="1">1</button>
      <button class="btn" data-value="2">2</button>
      <button class="btn" data-value="3">3</button>
      <button class="btn" data-value="+" style="background-color: aqua;">+</button>
      <button class="btn" data-value="4">4</button>
      <button class="btn" data-value="5">5</button>
      <button class="btn" data-value="6">6</button>
      <button class="btn" data-value="-" style="background-color: aqua;">-</button>
      <button class="btn" data-value="7">7</button>
      <button class="btn" data-value="8">8</button>
      <button class="btn" data-value="9">9</button>
      <button class="btn" data-value="*" style="background-color: aqua;">*</button>
      <button class="btn" data-value="/" style="background-color: aqua;">/</button>
      <button class="btn" data-value="0">0</button>
      <button class="btn" data-value=".">.</button>
      <button class="btn" data-action="calculate" style="background-color: aqua;width: 220px;">=</button>
    </div><br><br>

  </div>
  <script>
    // PERFORMANCE OPTIMIZATION (Bolt ⚡):
    // 1. Cached DOM query for `#display` to eliminate redundant DOM lookups on every button click.
    // 2. Used event delegation on `.btn-container` with a single event listener, replacing 17 individual inline onclick handlers.
    let currentvalue = '';
    const displayElement = document.querySelector('#display');
    const btnContainer = document.querySelector('.btn-container');

    displayElement.value = currentvalue;

    btnContainer.addEventListener('click', (event) => {
      const target = event.target;
      if (!target.classList.contains('btn')) return;

      const action = target.dataset.action;
      const value = target.dataset.value;

      if (action === 'clear') {
        currentvalue = '';
      } else if (action === 'calculate') {
        if (currentvalue) {
          try {
            currentvalue = eval(currentvalue);
          } catch (e) {
            currentvalue = 'Error';
          }
        }
      } else if (value !== undefined) {
        currentvalue += value;
      }

      displayElement.value = currentvalue;
    });
  </script>
</body>
</html>
