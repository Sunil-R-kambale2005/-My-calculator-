<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="calc.css">
  <title>Document</title>
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" readonly>
    <div class="btn-container">
      <button class="btn" style="background-color: orange;">c</button>
      <button class="btn">1</button>
      <button class="btn">2</button>
      <button class="btn">3</button>
      <button class="btn" style="background-color: aqua;">+</button>
      <button class="btn">4</button>
      <button class="btn">5</button>
      <button class="btn">6</button>
      <button class="btn" style="background-color: aqua;">-</button>
      <button class="btn">7</button>
      <button class="btn">8</button>
      <button class="btn">9</button>
      <button class="btn" style="background-color: aqua;">*</button>
      <button class="btn" style="background-color: aqua;">/</button>
      <button class="btn">0</button>
      <button class="btn">.</button>
      <button class="btn" style="background-color: aqua; width: 220px;">=</button>
    </div><br><br>
  </div>
  <script>
    let currentvalue = '';
    // Optimization: Cache DOM element reference to eliminate repetitive document queries on interaction
    const displayEl = document.querySelector("#display");
    displayEl.value = currentvalue;

    // Optimization: Single event listener on container (event delegation) instead of 17 individual inline handlers
    document.querySelector(".btn-container").addEventListener("click", (e) => {
      const btn = e.target.closest(".btn");
      if (!btn) return;

      const action = btn.innerText.trim();
      if (action === "c") {
        currentvalue = "";
      } else if (action === "=") {
        try {
          currentvalue = String(eval(currentvalue) ?? "");
        } catch {
          currentvalue = "";
        }
      } else {
        currentvalue += action;
      }
      displayEl.value = currentvalue;
    });
  </script>
</body>
</html>
