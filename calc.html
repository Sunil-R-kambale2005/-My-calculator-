<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="calc.css">
  <title>Document</title>
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" readonly>
    <div class="btn-container">
      <button class="btn" data-action="clear" style="background-color: orange;">c</button>
      <button class="btn" data-val="1">1</button>
      <button class="btn" data-val="2">2</button>
      <button class="btn" data-val="3">3</button>
      <button class="btn" data-val="+" style="background-color: aqua;">+</button>
      <button class="btn" data-val="4">4</button>
      <button class="btn" data-val="5">5</button>
      <button class="btn" data-val="6">6</button>
      <button class="btn" data-val="-" style="background-color: aqua;">-</button>
      <button class="btn" data-val="7">7</button>
      <button class="btn" data-val="8">8</button>
      <button class="btn" data-val="9">9</button>
      <button class="btn" data-val="*" style="background-color:aqua">*</button>
      <button class="btn" data-val="/" style="background-color: aqua;">/</button>
      <button class="btn" data-val="0">0</button>
      <button class="btn" data-val=".">.</button>
      <button class="btn" data-action="evaluate" style="background-color: aqua;width: 220px;">=</button>
    </div><br><br>

  </div>
  <script>
    // Bolt Optimization: Cache DOM queries and use event delegation
    // Avoids repeated DOM queries and inline JS evaluation on every button click
    let currentvalue = '';
    const displayEl = document.querySelector("#display");
    const container = document.querySelector(".btn-container");

    displayEl.value = currentvalue;

    container.addEventListener("click", (event) => {
      const target = event.target.closest("button.btn");
      if (!target) return;

      const action = target.dataset.action;
      const val = target.dataset.val;

      if (action === "clear") {
        currentvalue = '';
      } else if (action === "evaluate") {
        if (currentvalue) {
          try {
            currentvalue = String(eval(currentvalue));
          } catch (e) {
            currentvalue = 'Error';
          }
        }
      } else if (val !== undefined) {
        currentvalue += val;
      }

      displayEl.value = currentvalue;
    });
  </script>
</body>
</html>
