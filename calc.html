<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="calc.css">
  <title>Document</title>
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" readonly>
    <div class="btn-container">
      <button class="btn" style="background-color: orange;">c</button>
      <button class="btn">1</button>
      <button class="btn">2</button>
      <button class="btn">3</button>
      <button class="btn" style="background-color: aqua;">+</button>
      <button class="btn">4</button>
      <button class="btn">5</button>
      <button class="btn">6</button>
      <button class="btn" style="background-color: aqua;">-</button>
      <button class="btn">7</button>
      <button class="btn">8</button>
      <button class="btn">9</button>
      <button class="btn" style="background-color:aqua">*</button>
      <button class="btn" style="background-color: aqua;">/</button>
      <button class="btn">0</button>
      <button class="btn">.</button>
      <button class="btn" style="background-color: aqua;width: 220px;">=</button>
    </div><br><br>
  </div>
  <script>
    /**
     * BOLT PERFORMANCE OPTIMIZATIONS:
     * 1. Cached DOM Reference: Querying the DOM via `document.querySelector` on every click is slow.
     *    Caching the `#display` element reference using `document.getElementById` (which is faster than querySelector)
     *    avoids redundant DOM tree traversals.
     * 2. Event Delegation: Replaced 17 inline `onclick` handlers with a single click event listener on the parent `.btn-container`.
     *    This:
     *    - Reduces memory footprint (1 event listener vs 17).
     *    - Decreases initial HTML document size (bundle size savings) and speeds up DOM parsing time.
     *    - Simplifies maintenance and enhances code readability.
     */
    const display = document.getElementById('display');
    const btnContainer = document.querySelector('.btn-container');
    let currentvalue = '';

    // Initialize display value
    display.value = currentvalue;

    // High-performance single event listener using Event Delegation
    btnContainer.addEventListener('click', (event) => {
      const button = event.target.closest('.btn');
      if (!button) return;

      const value = button.textContent.trim();

      if (value === 'c') {
        currentvalue = '';
      } else if (value === '=') {
        try {
          // Evaluate the expression
          currentvalue = eval(currentvalue);
        } catch (e) {
          // If the expression is incomplete or invalid, handle gracefully
          currentvalue = 'Error';
        }
      } else {
        currentvalue = currentvalue + value;
      }

      display.value = currentvalue;
    });
  </script>
</body>
</html>
