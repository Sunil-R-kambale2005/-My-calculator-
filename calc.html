<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="calc.css">
  <title>Document</title>
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" readonly>
    <div class="btn-container">
      <button class="btn" data-action="clear" style="background-color: orange;">c</button>
      <button class="btn">1</button>
      <button class="btn">2</button>
      <button class="btn">3</button>
      <button class="btn" style="background-color: aqua;">+</button>
      <button class="btn">4</button>
      <button class="btn">5</button>
      <button class="btn">6</button>
      <button class="btn" style="background-color: aqua;">-</button>
      <button class="btn">7</button>
      <button class="btn">8</button>
      <button class="btn">9</button>
      <button class="btn" style="background-color: aqua;">*</button>
      <button class="btn" style="background-color: aqua;">/</button>
      <button class="btn">0</button>
      <button class="btn">.</button>
      <button class="btn" data-action="calculate" style="background-color: aqua;width: 220px;">=</button>
    </div><br><br>

  </div>
  <script>
    // Performance optimization:
    // 1. Cached `#display` DOM reference to avoid querying the DOM repeatedly on every button press.
    // 2. Used event delegation on `.btn-container` instead of 17 separate inline onclick attributes.
    let currentvalue = '';
    const displayEl = document.querySelector('#display');
    const btnContainer = document.querySelector('.btn-container');

    displayEl.value = currentvalue;

    btnContainer.addEventListener('click', (e) => {
      const btn = e.target.closest('.btn');
      if (!btn) return;

      const action = btn.dataset.action;
      if (action === 'clear') {
        currentvalue = '';
      } else if (action === 'calculate') {
        try {
          currentvalue = eval(currentvalue);
        } catch (err) {
          currentvalue = 'Error';
        }
      } else {
        currentvalue = currentvalue + btn.textContent.trim();
      }

      displayEl.value = currentvalue !== undefined ? currentvalue : '';
    });
  </script>
</body>
</html>
