<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="calc.css">
  <title>Document</title>
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" readonly>
    <div class="btn-container">
      <button class="btn" style="background-color: orange;">c</button>
      <button class="btn">1</button>
      <button class="btn">2</button>
      <button class="btn">3</button>
      <button class="btn" style="background-color: aqua;">+</button>
      <button class="btn">4</button>
      <button class="btn">5</button>
      <button class="btn">6</button>
      <button class="btn" style="background-color: aqua;">-</button>
      <button class="btn">7</button>
      <button class="btn">8</button>
      <button class="btn">9</button>
      <button class="btn" style="background-color: aqua;">*</button>
      <button class="btn" style="background-color: aqua;">/</button>
      <button class="btn">0</button>
      <button class="btn">.</button>
      <button class="btn" style="background-color: aqua;width: 220px;">=</button>
    </div><br><br>

  </div>
  <script>
    let currentvalue = '';

    // Performance Optimization: Cache DOM reference once to avoid querySelector overhead on every click
    const displayEl = document.querySelector('#display');
    displayEl.value = currentvalue;

    // Performance Optimization: Use single event listener delegation on container instead of 17 inline handlers
    const container = document.querySelector('.btn-container');
    container.addEventListener('click', (e) => {
      const btn = e.target.closest('button.btn');
      if (!btn) return;

      const btnValue = btn.textContent.trim();
      if (btnValue === 'c') {
        currentvalue = '';
      } else if (btnValue === '=') {
        currentvalue = eval(currentvalue);
      } else {
        currentvalue = currentvalue + btnValue;
      }
      displayEl.value = currentvalue;
    });
  </script>
</body>
</html>
