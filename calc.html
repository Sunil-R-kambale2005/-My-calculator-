<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="calc.css">
  <title>Document</title>
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" readonly>
    <div class="btn-container">
      <!-- Bolt Optimization: Refactored individual inline event listeners to data-attributes for Event Delegation. -->
      <button class="btn" data-action="clear" style="background-color: orange;">c</button>
      <button class="btn" data-val="1">1</button>
      <button class="btn" data-val="2">2</button>
      <button class="btn" data-val="3">3</button>
      <button class="btn" data-val="+" style="background-color: aqua;">+</button>
      <button class="btn" data-val="4">4</button>
      <button class="btn" data-val="5">5</button>
      <button class="btn" data-val="6">6</button>
      <button class="btn" data-val="-" style="background-color: aqua;">-</button>
      <button class="btn" data-val="7">7</button>
      <button class="btn" data-val="8">8</button>
      <button class="btn" data-val="9">9</button>
      <button class="btn" data-val="*" style="background-color: aqua;">*</button>
      <button class="btn" data-val="/" style="background-color: aqua;">/</button>
      <button class="btn" data-val="0">0</button>
      <button class="btn" data-val=".">.</button>
      <button class="btn" data-action="calculate" style="background-color: aqua; width: 220px;">=</button>
    </div><br><br>
  </div>
  <script>
    // Bolt Optimization: Cache DOM lookup of the display input element to avoid 17+ querySelector calls on every action.
    const display = document.getElementById("display");
    let currentvalue = '';
    display.value = currentvalue;

    // Bolt Optimization: Event Delegation. Register a single click listener on the parent container.
    // This reduces browser memory footprint, reduces garbage collection overhead from inline handlers, and keeps CSS/HTML decoupled.
    document.querySelector('.btn-container').addEventListener('click', function(event) {
      const btn = event.target.closest('.btn');
      if (!btn) return;

      const action = btn.getAttribute('data-action');
      const val = btn.getAttribute('data-val');

      if (action === 'clear') {
        currentvalue = '';
      } else if (action === 'calculate') {
        currentvalue = eval(currentvalue);
      } else if (val !== null) {
        currentvalue = currentvalue + val;
      }

      display.value = currentvalue;
    });
  </script>
</body>
</html>
