<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="calc.css">
  <title>Document</title>
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" readonly>
    <div class="btn-container">
      <button class="btn" style="background-color: orange;">c</button>
      <button class="btn">1</button>
      <button class="btn">2</button>
      <button class="btn">3</button>
      <button class="btn" style="background-color: aqua;">+</button>
      <button class="btn">4</button>
      <button class="btn">5</button>
      <button class="btn">6</button>
      <button class="btn" style="background-color: aqua;">-</button>
      <button class="btn">7</button>
      <button class="btn">8</button>
      <button class="btn">9</button>
      <button class="btn" style="background-color:aqua">*</button>
      <button class="btn" style="background-color: aqua;">/</button>
      <button class="btn">0</button>
      <button class="btn">.</button>
      <button class="btn" style="background-color: aqua;width: 220px;">=</button>
    </div><br><br>

  </div>
  <script>
    // Cache the DOM query for the display element to optimize event handling and performance.
    const display = document.getElementById('display');
    let currentvalue = '';
    display.value = currentvalue;

    // Use high-performance event delegation on the button container.
    // This avoids querying the DOM for '#display' on every single click,
    // and eliminates the overhead of registering individual inline onclick listeners.
    document.querySelector('.btn-container').addEventListener('click', (event) => {
      const button = event.target.closest('.btn');
      if (!button) return;

      const val = button.textContent.trim();
      if (val === 'c') {
        currentvalue = '';
      } else if (val === '=') {
        try {
          const result = eval(currentvalue);
          currentvalue = result === undefined ? '' : result;
        } catch (e) {
          // If an evaluation error (like SyntaxError) occurs, preserve previous state
          // and do not update display, exactly matching the original behavior.
          return;
        }
      } else {
        currentvalue = String(currentvalue) + val;
      }
      display.value = currentvalue;
    });
  </script>
</body>
</html>
