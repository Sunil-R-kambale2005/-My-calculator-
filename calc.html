<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="calc.css">
  <title>Document</title>
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" readonly>
    <div class="btn-container">
      <button class="btn" style="background-color: orange;">c</button>
      <button class="btn">1</button>
      <button class="btn">2</button>
      <button class="btn">3</button>
      <button class="btn" style="background-color: aqua;">+</button>
      <button class="btn">4</button>
      <button class="btn">5</button>
      <button class="btn">6</button>
      <button class="btn" style="background-color: aqua;">-</button>
      <button class="btn">7</button>
      <button class="btn">8</button>
      <button class="btn">9</button>
      <button class="btn" style="background-color: aqua;">*</button>
      <button class="btn" style="background-color: aqua;">/</button>
      <button class="btn">0</button>
      <button class="btn">.</button>
      <button class="btn" style="background-color: aqua;width: 220px;">=</button>
    </div><br><br>

  </div>
  <script>
    let currentvalue = '';

    // Performance optimization: Cache DOM reference once instead of executing querySelector on every interaction
    const displayEl = document.querySelector("#display");
    displayEl.value = currentvalue;

    // Performance optimization: Single event listener on container using event delegation
    // Avoids attaching 17 inline listener functions and reduces DOM traversal
    const btnContainer = document.querySelector(".btn-container");
    btnContainer.addEventListener("click", (event) => {
      const target = event.target;
      if (!target.classList.contains("btn")) return;

      const action = target.innerText.trim();
      if (action === "c") {
        currentvalue = '';
      } else if (action === "=") {
        currentvalue = eval(currentvalue);
      } else {
        currentvalue += action;
      }
      displayEl.value = currentvalue;
    });
  </script>
</body>
</html>
