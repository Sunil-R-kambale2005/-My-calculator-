<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="calc.css">
  <title>Document</title>
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" readonly>
    <div class="btn-container">
      <button class="btn" style="background-color: orange;">c</button>
      <button class="btn">1</button>
      <button class="btn">2</button>
      <button class="btn">3</button>
      <button class="btn" style="background-color: aqua;">+</button>
      <button class="btn">4</button>
      <button class="btn">5</button>
      <button class="btn">6</button>
      <button class="btn" style="background-color: aqua;">-</button>
      <button class="btn">7</button>
      <button class="btn">8</button>
      <button class="btn">9</button>
      <button class="btn" style="background-color: aqua;">*</button>
      <button class="btn" style="background-color: aqua;">/</button>
      <button class="btn">0</button>
      <button class="btn">.</button>
      <button class="btn" style="background-color: aqua; width: 220px;">=</button>
    </div><br><br>
  </div>
  <script>
    // ⚡ Performance Optimization:
    // 1. Cache the #display element reference in a variable on page load so we don't query the DOM
    //    with document.querySelector('#display') on every single button click.
    // 2. Refactor event handling by utilizing efficient event delegation on the '.btn-container'
    //    parent element instead of setting inline 'onclick' attributes on all 17 buttons. This
    //    saves memory and avoids registering multiple event handlers.
    const display = document.getElementById('display');
    const btnContainer = document.querySelector('.btn-container');

    let currentvalue = '';
    display.value = currentvalue;

    btnContainer.addEventListener('click', (event) => {
      const button = event.target.closest('.btn');
      if (!button) return;

      const val = button.textContent.trim();

      if (val === 'c') {
        currentvalue = '';
        display.value = currentvalue;
      } else if (val === '=') {
        try {
          // Safely evaluate the current expression.
          const result = eval(currentvalue);
          currentvalue = result !== undefined ? String(result) : '';
          display.value = currentvalue;
        } catch (err) {
          // If the expression is invalid, evaluation fails. Keep display and current value unchanged,
          // matching original behavior.
          console.error('Invalid expression:', err);
        }
      } else {
        currentvalue += val;
        display.value = currentvalue;
      }
    });
  </script>
</body>
</html>
