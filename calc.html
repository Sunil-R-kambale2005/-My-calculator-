<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="calc.css">
  <title>Document</title>
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" readonly>
    <div class="btn-container">
      <!--
        Bolt Optimization: Removed inline onclick handlers on all buttons.
        Replaced with a single delegated event listener on the parent container.
        Each button now defines its associated action in data-value attribute.
      -->
      <button class="btn" data-value="c" style="background-color: orange;">c</button>
      <button class="btn" data-value="1">1</button>
      <button class="btn" data-value="2">2</button>
      <button class="btn" data-value="3">3</button>
      <button class="btn" data-value="+" style="background-color: aqua;">+</button>
      <button class="btn" data-value="4">4</button>
      <button class="btn" data-value="5">5</button>
      <button class="btn" data-value="6">6</button>
      <button class="btn" data-value="-" style="background-color: aqua;">-</button>
      <button class="btn" data-value="7">7</button>
      <button class="btn" data-value="8">8</button>
      <button class="btn" data-value="9">9</button>
      <button class="btn" data-value="*" style="background-color:aqua">*</button>
      <button class="btn" data-value="/" style="background-color: aqua;">/</button>
      <button class="btn" data-value="0">0</button>
      <button class="btn" data-value=".">.</button>
      <button class="btn" data-value="=" style="background-color: aqua;width: 220px;">=</button>
    </div><br><br>

  </div>
  <script>
    // Bolt Optimization: Cache the DOM lookup for '#display' to avoid querying the DOM
    // on every click/input event.
    const display = document.getElementById("display");
    let currentvalue = '';
    display.value = currentvalue;

    // Bolt Optimization: Use event delegation with a single listener on '.btn-container'
    // instead of 17 separate event handlers. This reduces memory footprint and improves
    // load/execution performance.
    document.querySelector('.btn-container').addEventListener('click', (event) => {
      const button = event.target.closest('.btn');
      if (!button) return;

      const value = button.getAttribute('data-value');

      if (value === 'c') {
        currentvalue = '';
      } else if (value === '=') {
        currentvalue = eval(currentvalue);
      } else {
        currentvalue += value;
      }

      display.value = currentvalue;
    });
  </script>
</body>
</html>
