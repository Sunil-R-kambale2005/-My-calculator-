<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="calc.css">
  <title>Document</title>
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" readonly>
    <div class="btn-container">
      <!-- Removed all inline onclick handlers to leverage event delegation and improve startup and click performance -->
      <button class="btn" style="background-color: orange;">c</button>
      <button class="btn">1</button>
      <button class="btn">2</button>
      <button class="btn">3</button>
      <button class="btn" style="background-color: aqua;">+</button>
      <button class="btn">4</button>
      <button class="btn">5</button>
      <button class="btn">6</button>
      <button class="btn" style="background-color: aqua;">-</button>
      <button class="btn">7</button>
      <button class="btn">8</button>
      <button class="btn">9</button>
      <button class="btn" style="background-color:aqua">*</button>
      <button class="btn" style="background-color: aqua;">/</button>
      <button class="btn">0</button>
      <button class="btn">.</button>
      <button class="btn" style="background-color: aqua;width: 220px;">=</button>
    </div><br><br>
  </div>
  <script>
    // Initialize currentvalue state
    let currentvalue = '';

    // Performance Optimization: Cache DOM reference to avoid querying the DOM on every button press
    const displayElement = document.getElementById("display");
    displayElement.value = currentvalue;

    // Performance Optimization: Use a single click event listener on the container (Event Delegation)
    // This reduces the number of event bindings, lowers memory consumption, and speeds up interaction
    const btnContainer = document.querySelector('.btn-container');
    btnContainer.addEventListener('click', (event) => {
      const button = event.target.closest('.btn');
      if (!button) return;

      const action = button.textContent.trim();

      if (action === 'c') {
        currentvalue = '';
      } else if (action === '=') {
        try {
          const result = eval(currentvalue);
          currentvalue = result === undefined ? '' : String(result);
        } catch (error) {
          currentvalue = 'Error';
        }
      } else {
        currentvalue += action;
      }

      displayElement.value = currentvalue;
    });
  </script>
</body>
</html>
