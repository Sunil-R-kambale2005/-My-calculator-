<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="calc.css">
  <title>Document</title>
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" readonly>
    <div class="btn-container">
      <button class="btn" data-action="clear" style="background-color: orange;">c</button>
      <button class="btn" data-val="1">1</button>
      <button class="btn" data-val="2">2</button>
      <button class="btn" data-val="3">3</button>
      <button class="btn" data-val="+" style="background-color: aqua;">+</button>
      <button class="btn" data-val="4">4</button>
      <button class="btn" data-val="5">5</button>
      <button class="btn" data-val="6">6</button>
      <button class="btn" data-val="-" style="background-color: aqua;">-</button>
      <button class="btn" data-val="7">7</button>
      <button class="btn" data-val="8">8</button>
      <button class="btn" data-val="9">9</button>
      <button class="btn" data-val="*" style="background-color: aqua;">*</button>
      <button class="btn" data-val="/" style="background-color: aqua;">/</button>
      <button class="btn" data-val="0">0</button>
      <button class="btn" data-val=".">.</button>
      <button class="btn" data-action="calculate" style="background-color: aqua;width: 220px;">=</button>
    </div><br><br>
  </div>
  <script>
    // Performance Optimizations:
    // 1. Cache DOM references using document.getElementById for direct fast lookup instead of querySelector CSS engine parsing.
    // 2. Use event delegation on .btn-container instead of multiple inline onclick handlers.
    // 3. Avoid redundant DOM updates by checking if displayEl.value has actually changed before writing to DOM.
    // 4. Use scoped Function constructor instead of eval() to eliminate local scope chain overhead during expression evaluation.
    const displayEl = document.getElementById('display');
    const containerEl = document.querySelector('.btn-container');
    let currentvalue = '';

    displayEl.value = currentvalue;

    containerEl.addEventListener('click', (event) => {
      const btn = event.target.closest('.btn');
      if (!btn) return;

      const action = btn.dataset.action;
      const val = btn.dataset.val;

      if (action === 'clear') {
        currentvalue = '';
      } else if (action === 'calculate') {
        try {
          // Function constructor executes in global scope, avoiding scope chain lookup overhead of eval
          currentvalue = String(Function('"use strict"; return (' + currentvalue + ')')());
        } catch (e) {
          currentvalue = '';
        }
      } else if (val !== undefined) {
        currentvalue += val;
      }

      // Avoid unnecessary DOM mutations if value hasn't changed
      if (displayEl.value !== currentvalue) {
        displayEl.value = currentvalue;
      }
    });
  </script>
</body>
</html>
